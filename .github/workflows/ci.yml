name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests de la simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # La simulation (dsi-core) et la plateforme sont du Rust pur : pas de GPU ni de
      # bibliothèque système nécessaire. Les tests valident aussi tout data/*.json.
      - run: cargo test
      - run: cargo clippy -- -D warnings

  web:
    name: Build navigateur + test de fumée
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Installer wasm-bindgen-cli (version de Cargo.lock)
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: Installer wasm-opt (binaryen natif)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - run: RENDERERS=webgl2 tools/build-web.sh
      - name: Test de fumée dans Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/smoke_test.py dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsi-le-jeu-web
          path: |
            dist
            smoke-shots
