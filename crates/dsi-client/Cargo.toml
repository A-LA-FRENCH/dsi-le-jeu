[package]
name = "dsi-client"
description = "DSI — Le Jeu : couche de présentation Bevy (siège en pixel art, tableau de bord egui, audio)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dsi-le-jeu"
path = "src/main.rs"

[features]
default = ["webgl2"]
# Activer exactement une des deux pour un build navigateur.
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]

[dependencies]
dsi-core.workspace = true
platform.workspace = true
serde.workspace = true
serde_json.workspace = true

bevy = { version = "=0.19.1", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
    "png",
    "x11",
    "web",
] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["render", "default_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Location"] }
